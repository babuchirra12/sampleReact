
name: React Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build React application
      - name: Build React
        run: npm run build

      # Step 5: Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/my-react-app:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/my-react-app:${{ github.sha }} .

      # Step 6: Test Docker image
      - name: Test Docker image
        run: |
          docker run -d -p 8080:80 \
            --name react-test \
            ${{ secrets.DOCKERHUB_USERNAME }}/my-react-app:latest

          for i in {1..15}; do
            if curl -fsS http://localhost:8080/; then
              echo "Docker container test passed"
              exit 0
            fi
            sleep 2
          done

          docker logs react-test
          exit 1

      # Step 7: Login to Docker Hub
      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 8: Push image to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-react-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-react-app:${{ github.sha }}

      # Step 9: Cleanup
      - name: Cleanup
        if: always()
        run: docker rm -f react-test || true
  